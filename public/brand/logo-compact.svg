<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="badgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#475569" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Hexagonal / Shield Badge Silhouette -->
  <path d="M 100 8 L 188 42 L 188 152 L 100 212 L 12 152 L 12 42 Z" 
        fill="url(#badgeBg)" 
        stroke="url(#badgeStroke)" 
        stroke-width="2.5" />

  <!-- Inner subtle border -->
  <path d="M 100 16 L 180 47 L 180 148 L 100 202 L 20 148 L 20 47 Z" 
        fill="none" 
        stroke="#334155" 
        stroke-width="1" 
        stroke-dasharray="4 3" 
        opacity="0.5" />

  <!-- Symbol Centered -->
  <g transform="translate(48, 28) scale(0.88)">
    <path d="M 12 36 L 24 36 L 21 42 L 9 42 Z" fill="#F59E0B" opacity="0.85" />
    <path d="M 6 48 L 22 48 L 19 54 L 3 54 Z" fill="#F59E0B" opacity="0.65" />
    <path d="M 40 18 C 52 18, 98 18, 105 40 C 110 57, 98 70, 78 70 L 48 70 L 54 54 L 74 54 C 85 54, 90 48, 88 38 C 86 28, 74 26, 56 26 L 44 26 Z" fill="url(#badgeGold)" />
    <path d="M 28 18 L 58 18 L 38 58 L 54 58 L 18 108 L 30 68 L 18 68 L 36 28 L 24 28 Z" fill="url(#badgeGold)" />
    <path d="M 33 22 L 52 22 L 36 54 L 46 54 L 24 94 L 31 64 L 22 64 L 36 32 L 28 32 Z" fill="#FFF3B0" />
  </g>

  <!-- Badge Typography -->
  <text x="100" y="146" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="8.5" 
        font-weight="800" 
        letter-spacing="3" 
        fill="#94A3B8" 
        font-style="italic">
    DISTRIBUIDORA
  </text>

  <g transform="skewX(-9)">
    <text x="106" y="174" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif" 
          font-size="20" 
          font-weight="900" 
          letter-spacing="0.5">
      <tspan fill="url(#badgeGold)">PONTO </tspan>
      <tspan fill="#FFFFFF">FORTE</tspan>
    </text>
  </g>

  <text x="100" y="193" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="7.5" 
        font-weight="700" 
        letter-spacing="2.5" 
        fill="#64748B">
    PLANALTINA - DF
  </text>
</svg>
