<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="pGoldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE685" />
      <stop offset="25%" stop-color="#FFC107" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pGoldSecondary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="pBoltInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF085" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Speed streaks (Left aerodynamic cuts) -->
  <path d="M 12 36 L 24 36 L 21 42 L 9 42 Z" fill="#F59E0B" opacity="0.85" />
  <path d="M 6 48 L 22 48 L 19 54 L 3 54 Z" fill="#F59E0B" opacity="0.65" />

  <!-- Main P-Bolt Body: Engineered combination of P-Loop & Lightning Bolt -->
  <!-- Loop of the P -->
  <path d="M 40 18 
           C 52 18, 98 18, 105 40 
           C 110 57, 98 70, 78 70 
           L 48 70 
           L 54 54 
           L 74 54 
           C 85 54, 90 48, 88 38 
           C 86 28, 74 26, 56 26 
           L 44 26 
           Z" 
        fill="url(#pGoldSecondary)" />

  <!-- Lightning Bolt Stem (Sharp dynamic descending spear) -->
  <path d="M 28 18 
           L 58 18 
           L 38 58 
           L 54 58 
           L 18 108 
           L 30 68 
           L 18 68 
           L 36 28 
           L 24 28 
           Z" 
        fill="url(#pGoldPrimary)" />

  <!-- Inner core highlight reflection -->
  <path d="M 33 22 
           L 52 22 
           L 36 54 
           L 46 54 
           L 24 94 
           L 31 64 
           L 22 64 
           L 36 32 
           L 28 32 
           Z" 
        fill="url(#pBoltInner)" 
        opacity="0.9" />

  <!-- Bevel accent edge on P loop -->
  <path d="M 76 54 
           C 86 54, 91 47, 89 39 
           C 88 34, 83 29, 74 27 
           C 72 29, 78 35, 78 40 
           C 78 46, 74 52, 68 54 
           Z" 
        fill="#FFFFFF" 
        opacity="0.35" />
</svg>
